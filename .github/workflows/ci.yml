name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint . --max-warnings=0
      - run: pnpm typecheck
      - run: pnpm test:migrations
      - run: pnpm build
      - run: pnpm_config_verify_deps_before_run=false pnpm exec opennextjs-cloudflare build
      - run: pnpm exec playwright install --with-deps chromium
      - run: |
          printf '%s\n' \
            'BETTER_AUTH_URL=http://localhost:8788' \
            'BETTER_AUTH_E2E_TEST_MODE=true' \
            'NEXT_PUBLIC_APP_URL=http://localhost:8788' \
            'BETTER_AUTH_SECRET=rungset-ci-only-test-secret-not-for-production' > .dev.vars
          pnpm test:e2e
      - name: Preserve browser-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: pnpm test
